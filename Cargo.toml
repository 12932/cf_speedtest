[package]
name = "cf_speedtest"
version = "0.8.0"
authors = ["https://github.com/12932"]
repository = "https://github.com/12932/cf_speedtest"
keywords = ["cross-platform", "speedtest", "cli", "speed", "test"]
categories = ["command-line-utilities"]
edition = "2021"
license = "MIT"
description = "A command-line internet speed test tool"
readme = "README.md"
default-run = "cf_speedtest"

[[bin]]
name = "cf_speedtest"
path = "src/main.rs"
doc = false

[dependencies]
ureq = "3.3.0"
chrono = "0.4.44"
argh = "0.1.19"
rustls = { version = "0.23.39", default-features = false, features = ["ring"] }
webpki-roots = "1.0.7"
ctrlc = "3.5.2"
phf = { version = "0.14", features = ["macros"] }

[profile.release]
debug = false
strip = "none"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
